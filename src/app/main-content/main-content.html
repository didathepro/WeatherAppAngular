<div class="flex flex-col min-h-screen">

    <!-- Main weather card -->
    <div class="relative mx-6 md:mx-15 mt-10 h-[50vh] shadow-2xl rounded-3xl overflow-hidden">

        <img
            [src]="temperature <= 15 ? './coldweather.jpg' : './hotweather.jpg'"
            alt="Weather"
            class="absolute inset-0 w-full h-full object-cover"
        >

        <div class="relative z-10 h-full flex flex-col items-center justify-center text-white">
            <h5 class="text-4xl pb-5">
                {{city}}
            </h5>

            <h3 class="text-7xl md:text-8xl">
                {{temperature}} °C
            </h3>
        </div>

    </div>


    <!-- More information -->
    <div class="mx-6 md:mx-15 -mt-8 relative z-20">

        <div class="text-white bg-[#5e64b5] rounded-b-3xl px-6 md:px-12 pt-12 pb-6">

            <p class="text-2xl md:text-3xl mb-8">
                More information
            </p>


            <!-- Information grid -->
            <div class="grid grid-cols-2 gap-10 w-screen mx-15 my-15">

                <!-- Min -->
                <div class="flex items-center gap-4">

                    <div class="flex flex-col items-center">
                        <img
                            class="h-15 w-15"
                            src="./mintemp.png"
                            alt=""
                        >
                        <span>min</span>
                    </div>

                    <h6 class="text-2xl md:text-3xl">
                        {{minTemperature}}°
                    </h6>

                </div>


                <!-- Max -->
                <div class="flex items-center gap-4">

                    <div class="flex flex-col items-center">
                        <img
                            class="h-15 w-15"
                            src="./hottemp.png"
                            alt=""
                        >
                        <span>max</span>
                    </div>

                    <h6 class="text-2xl md:text-3xl">
                        {{maxTemperature}}°
                    </h6>

                </div>


                <!-- Moisture -->
                <div class="flex items-center gap-4">

                    <div class="flex flex-col items-center">
                        <img
                            class="h-15 w-15"
                            src="./mintemp.png"
                            alt=""
                        >
                        <span>moisture</span>
                    </div>

                    <h6 class="text-2xl md:text-3xl">
                        {{moisture}} %
                    </h6>

                </div>


                <!-- Wind -->
                <div class="flex items-center gap-4">

                    <div class="flex flex-col items-center">
                        <img
                            class="h-15 w-15"
                            src="./mintemp.png"
                            alt=""
                        >
                        <span>wind</span>
                    </div>

                    <h6 class="text-2xl md:text-3xl">
                        {{windSpeed}} km/h
                    </h6>

                </div>

            </div>

        </div>

    </div>

</div>
```
